<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Intro - Jornadas Universitarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="event-data.js"></script>
<style>
  :root {
    --beige-50: #faf6ef;
    --beige-100: #f5efe4;
    --beige-200: #ece2d0;
    --beige-300: #e0d2b8;
    --beige-400: #d4bc96;
    --gold: #c9a96e;
    --gold-dark: #a8894f;
    --brown-900: #2c2416;
    --brown-700: #4a3a24;
    --brown-500: #7a6444;
    --brown-300: #a89478;
    --accent: #8b6f47;
    --shadow: 0 20px 60px rgba(44, 36, 22, 0.18);
    --shadow-soft: 0 8px 24px rgba(44, 36, 22, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--brown-900);
    background: transparent;
  }

  /* Fondo elegante beige con textura sutil */
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    background:
      radial-gradient(1200px 700px at 80% 10%, rgba(201,169,110,0.18), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(224,210,184,0.35), transparent 60%),
      linear-gradient(135deg, #faf6ef 0%, #f0e6d2 50%, #e8dcc4 100%);
    overflow: hidden;
  }

  /* Textura de papel sutil */
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(44,36,22,0.015) 0px, rgba(44,36,22,0.015) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(44,36,22,0.012) 0px, rgba(44,36,22,0.012) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  /* Orbes decorativos */
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(40px); opacity: 0.35;
    pointer-events: none;
  }
  .orb-1 { width: 420px; height: 420px; top: -120px; right: -80px; background: var(--gold); }
  .orb-2 { width: 360px; height: 360px; bottom: -100px; left: -60px; background: var(--beige-300); }

  /* Grid de layout */
  .layout {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 420px;
    grid-template-rows: auto 1fr auto;
    gap: 24px;
    padding: 36px 48px;
  }

  /* Header */
  .header {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(44,36,22,0.12);
  }
  .brand {
    display: flex; align-items: center; gap: 16px;
  }
  .logo-box {
    width: 128px; height: 128px;
    border-radius: 16px;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-soft);
    border: 1px solid rgba(44,36,22,0.08);
    padding: 8px;
    overflow: hidden;
  }
  .logo-box img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .brand-text .uni {
    font-size: 13px; font-weight: 600; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--brown-500);
  }
  .brand-text .event {
    font-family: 'Playfair Display', serif;
    font-size: 26px; font-weight: 700; color: var(--brown-900);
    line-height: 1.1; margin-top: 2px;
  }
  .header-right {
    text-align: right;
  }
  .live-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--brown-900); color: var(--beige-50);
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .live-badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e85d4a;
    box-shadow: 0 0 0 0 rgba(232,93,74,0.6);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(232,93,74,0.6); }
    70% { box-shadow: 0 0 0 10px rgba(232,93,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,93,74,0); }
  }
  .header-date {
    margin-top: 8px; font-size: 13px; color: var(--brown-500);
    font-weight: 500;
  }

  /* Columna principal */
  .main {
    grid-column: 1; grid-row: 2;
    display: flex; flex-direction: column; gap: 24px;
    justify-content: center;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: var(--gold-dark);
  }
  .eyebrow::before {
    content: ""; width: 32px; height: 1px; background: var(--gold);
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 58px; font-weight: 700; line-height: 1.05;
    color: var(--brown-900);
    letter-spacing: -1.5px;
    max-width: 720px;
  }
  .headline em {
    font-style: italic; color: var(--gold-dark);
  }

  .subhead {
    font-size: 17px; line-height: 1.6; color: var(--brown-700);
    max-width: 640px; font-weight: 400;
  }

  /* Tarjeta próxima ponencia */
  .next-card {
    margin-top: 28px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(44,36,22,0.10);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: var(--shadow);
    max-width: 720px;
    position: relative; overflow: hidden;
  }
  .next-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-dark));
  }
  .next-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--gold-dark);
    margin-bottom: 10px;
  }
  .next-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px; font-weight: 700; line-height: 1.2;
    color: var(--brown-900); margin-bottom: 8px;
  }
  .next-desc {
    font-size: 14px; line-height: 1.55; color: var(--brown-700);
    margin-bottom: 14px; font-weight: 400;
  }
  .next-meta {
    display: flex; flex-wrap: wrap; gap: 18px;
    font-size: 14px; color: var(--brown-700);
  }
  .next-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .next-meta .ico { color: var(--gold-dark); }

  /* Columna lateral: agenda */
  .side {
    grid-column: 2; grid-row: 2;
    display: flex; flex-direction: column; gap: 16px;
  }
  .side-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(44,36,22,0.10);
    border-radius: 18px;
    padding: 22px 22px;
    box-shadow: var(--shadow-soft);
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .side-title {
    font-size: 12px; font-weight: 700; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--brown-500);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .side-title::after {
    content: ""; flex: 1; height: 1px; background: rgba(44,36,22,0.12);
  }

  .day-tabs {
    display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .day-tab {
    flex: 1; min-width: 0;
    padding: 8px 10px; border-radius: 10px;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(44,36,22,0.08);
    font-size: 12px; font-weight: 600; color: var(--brown-700);
    cursor: pointer; user-select: none; text-align: center;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .day-tab:hover { background: rgba(255,255,255,0.7); }
  .day-tab.active {
    background: linear-gradient(135deg, rgba(201,169,110,0.30), rgba(201,169,110,0.10));
    border-color: rgba(201,169,110,0.55);
    color: var(--brown-900);
  }

  .agenda-list {
    list-style: none; display: flex; flex-direction: column; gap: 10px;
    overflow-y: auto; flex: 1;
    padding-right: 4px;
  }
  .agenda-list::-webkit-scrollbar { width: 4px; }
  .agenda-list::-webkit-scrollbar-thumb { background: var(--beige-300); border-radius: 4px; }

  .agenda-item {
    display: grid; grid-template-columns: 62px 1fr; gap: 12px;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(44,36,22,0.06);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
    cursor: pointer;
    user-select: none;
  }
  .agenda-item:hover {
    transform: translateX(4px);
    background: rgba(255,255,255,0.7);
    border-color: rgba(201,169,110,0.35);
  }
  .agenda-item.active {
    background: linear-gradient(135deg, rgba(201,169,110,0.30), rgba(201,169,110,0.10));
    border-color: rgba(201,169,110,0.55);
  }
  .agenda-item.past { opacity: 0.45; }
  .agenda-hint {
    font-size: 11px; color: var(--brown-500); font-style: italic;
    margin-top: 6px;
  }
  .ag-time {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 700; color: var(--brown-900);
    line-height: 1.1;
  }
  .ag-time small { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; color: var(--brown-500); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .ag-title { font-size: 13px; font-weight: 600; color: var(--brown-900); line-height: 1.3; }
  .ag-speaker { font-size: 12px; color: var(--brown-500); margin-top: 3px; }

  /* Footer info */
  .footer {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid rgba(44,36,22,0.12);
    font-size: 13px; color: var(--brown-500);
  }
  .footer-left { display: flex; gap: 24px; }
  .footer-item { display: inline-flex; align-items: center; gap: 8px; }
  .footer-item .ico { color: var(--gold-dark); }
  .footer-hash { font-weight: 600; color: var(--brown-700); letter-spacing: 0.5px; }
  .footer-sponsors {
    display: flex; align-items: center; gap: 12px;
  }
  .sponsors-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--brown-500);
  }
  .sponsors-list {
    display: flex; align-items: center; gap: 10px;
  }
  .sponsor-box {
    width: 128px; height: 128px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid rgba(44,36,22,0.08);
    box-shadow: var(--shadow-soft);
    display: flex; align-items: center; justify-content: center;
    padding: 6px; overflow: hidden;
  }
  .sponsor-box img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }

  /* Animaciones de entrada */
  .fade-in { animation: fadeIn 1s ease both; }
  .slide-up { animation: slideUp .8s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* Responsive para 1920x1080 (default) y otros */
  @media (max-width: 1200px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; padding: 24px 32px; }
    .side { grid-column: 1; grid-row: 3; }
    .main { grid-row: 2; }
    .headline { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="layout">
    <!-- Header -->
    <header class="header fade-in">
      <div class="brand">
        <div class="logo-box">
          <img src="logo.png" alt="Logo de la universidad" onerror="var p=this.parentElement; this.style.display='none'; p.style.color='#2c2416'; p.style.fontFamily='Playfair Display, serif'; p.style.fontSize='26px'; p.style.fontWeight='700'; p.textContent='U';">
        </div>
        <div class="brand-text">
          <div class="uni">Universidad · Facultad</div>
          <div class="event">Jornadas Académicas</div>
        </div>
      </div>
      <div class="header-right">
        <div class="live-badge"><span class="dot"></span> En directo</div>
        <div class="header-date" id="headerDate">—</div>
      </div>
    </header>

    <!-- Columna principal -->
    <main class="main">
      <div class="eyebrow slide-up" style="animation-delay:.1s">Benvidos e benvidas a retrasmisión</div>
      <h1 class="headline slide-up" style="animation-delay:.2s"></h1>
      <p class="subhead slide-up" style="animation-delay:.3s"></p>

      <article class="next-card slide-up" style="animation-delay:.4s">
        <div class="next-tag">Próxima ponencia</div>
        <h2 class="next-title" id="nextTitle">Título de la ponencia</h2>
        <p class="next-desc" id="nextDesc">Descripción breve del tema a tratar en esta ponencia.</p>
        <div class="next-meta">
          <span><span class="ico">👤</span><span id="nextSpeaker">Nombre del ponente</span></span>
          <span><span class="ico">🕐</span><span id="nextTime">00:00</span></span>
          <span><span class="ico">📍</span><span id="nextRoom">Aula / Sala</span></span>
        </div>
      </article>
    </main>

    <!-- Columna lateral -->
    <aside class="side">
      <div class="side-card slide-up" style="animation-delay:.3s">
        <div class="side-title">Agenda</div>
        <div class="day-tabs" id="dayTabs"></div>
        <ul class="agenda-list" id="agendaList"></ul>
      </div>
    </aside>

    <!-- Footer -->
    <footer class="footer fade-in" style="animation-delay:.6s">
      <div class="footer-left">
        <span class="footer-item"><span class="ico">📍</span></span>
        <span class="footer-item"><span class="ico">🌐</span></span>
        <span class="footer-item"><span class="ico">✉️</span></span>
      </div>
      <div class="footer-sponsors">
        <span class="sponsors-label"></span>
        <div class="sponsors-list" id="sponsorsList"></div>
      </div>
      <div class="footer-hash">#JornadasUniversitarias</div>
    </footer>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — edita aquí los datos de tu evento
   ============================================================ */
const CONFIG = Object.assign({}, window.EVENT_DATA || {}, (window.EVENT_DATA && window.EVENT_DATA.intro) || {});
/* ============================================================ */

// Aplicar textos de configuración
function applyConfig() {
  const logoImg = document.querySelector('.logo-box img');
  if (logoImg && CONFIG.logo) logoImg.src = CONFIG.logo;
  document.querySelector('.uni').textContent = CONFIG.university;

  // Patrocinadores
  const sponsorsList = document.getElementById('sponsorsList');
  sponsorsList.innerHTML = '';
  (CONFIG.sponsors || []).forEach((src, i) => {
    const box = document.createElement('div');
    box.className = 'sponsor-box';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Patrocinador ' + (i + 1);
    img.onerror = function () {
      const p = this.parentElement;
      this.style.display = 'none';
      p.style.color = '#7a6444';
      p.style.fontFamily = 'Inter, sans-serif';
      p.style.fontSize = '9px';
      p.style.fontWeight = '700';
      p.textContent = 'SP' + (i + 1);
    };
    box.appendChild(img);
    sponsorsList.appendChild(box);
  });
  document.querySelector('.event').textContent = CONFIG.eventTitle;
  document.getElementById('headerDate').textContent = CONFIG.eventDate;
  document.querySelector('.headline').innerHTML = CONFIG.headline
    .replace(/\n/g, '<br>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
  // mantener el em en la segunda frase si está
  document.querySelector('.subhead').textContent = CONFIG.subhead;
  document.querySelector('.footer-hash').textContent = CONFIG.hashtag;
  document.querySelector('.footer-left').children[0].innerHTML = `<span class="ico">📍</span> ${CONFIG.place}`;
  document.querySelector('.footer-left').children[1].innerHTML = `<span class="ico">🌐</span> ${CONFIG.web}`;
  document.querySelector('.footer-left').children[2].innerHTML = `<span class="ico">✉️</span> ${CONFIG.email}`;

  // La tarjeta y la agenda se rellenan en selectTalk() tras cargar la selección
}

// Selección interactiva de la próxima ponencia (multi-día)
let currentDay = 0;
let selectedByDay = {}; // dayIndex -> title of selected talk

function dayAgenda() { return CONFIG.days[currentDay].agenda; }

function loadSelection() {
  try {
    const d = localStorage.getItem('introSelectedDay');
    if (d !== null) currentDay = parseInt(d, 10) || 0;
    const raw = localStorage.getItem('introSelectedByDay');
    if (raw) selectedByDay = JSON.parse(raw);
  } catch (e) {}
  if (currentDay >= CONFIG.days.length) currentDay = 0;
  // Resolve selected index from stored title; fall back to event-data.js active state
  const agenda = dayAgenda();
  const storedTitle = selectedByDay[currentDay];
  let idx = storedTitle ? agenda.findIndex(a => a.title === storedTitle) : -1;
  if (idx < 0) {
    idx = agenda.findIndex(a => a.state === 'active');
    if (idx < 0) idx = 0;
  }
  selectedByDay[currentDay] = agenda[idx].title;
}

function saveSelection() {
  try {
    localStorage.setItem('introSelectedDay', String(currentDay));
    localStorage.setItem('introSelectedByDay', JSON.stringify(selectedByDay));
  } catch (e) {}
}

function selectDay(i) {
  currentDay = i;
  const agenda = dayAgenda();
  if (!selectedByDay[currentDay]) {
    const active = agenda.findIndex(a => a.state === 'active');
    selectedByDay[currentDay] = agenda[active >= 0 ? active : 0].title;
  }
  // validate stored title exists in this day's agenda
  if (agenda.findIndex(a => a.title === selectedByDay[currentDay]) < 0) {
    const active = agenda.findIndex(a => a.state === 'active');
    selectedByDay[currentDay] = agenda[active >= 0 ? active : 0].title;
  }
  saveSelection();
  renderDayTabs();
  const idx = agenda.findIndex(a => a.title === selectedByDay[currentDay]);
  applyStates(idx);
  updateCard(idx);
  renderAgenda();
}

function applyStates(idx) {
  dayAgenda().forEach((a, i) => {
    a.state = i < idx ? 'past' : i === idx ? 'active' : '';
  });
}

function selectTalk(idx) {
  selectedByDay[currentDay] = dayAgenda()[idx].title;
  saveSelection();
  applyStates(idx);
  updateCard(idx);
  renderAgenda();
}

function updateCard(idx) {
  const a = dayAgenda()[idx];
  document.getElementById('nextTitle').textContent = a.title;
  document.getElementById('nextDesc').textContent = a.desc || '';
  document.getElementById('nextSpeaker').textContent = a.speaker;
  document.getElementById('nextTime').textContent = a.time;
  document.getElementById('nextRoom').textContent = a.room || '—';
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  CONFIG.days.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === currentDay ? ' active' : '');
    btn.textContent = d.label;
    btn.addEventListener('click', () => selectDay(i));
    container.appendChild(btn);
  });
}

function renderAgenda() {
  const list = document.getElementById('agendaList');
  list.innerHTML = '';
  dayAgenda().forEach((a, idx) => {
    const li = document.createElement('li');
    li.className = 'agenda-item ' + (a.state || '');
    li.dataset.index = idx;
    li.innerHTML = `
      <div class="ag-time">${a.time}<small>${a.state === 'active' ? 'ahora' : a.state === 'past' ? 'pasado' : ''}</small></div>
      <div>
        <div class="ag-title">${a.title}</div>
        <div class="ag-speaker">${a.speaker}</div>
      </div>`;
    li.addEventListener('click', () => selectTalk(idx));
    list.appendChild(li);
  });
}

applyConfig();
loadSelection();
renderDayTabs();
selectDay(currentDay);
</script>
</body>
</html>
